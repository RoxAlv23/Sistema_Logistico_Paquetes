<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión - Sistema Logístico</title>

    <link
        rel="stylesheet"
        href="css/estilos.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-header">

                <h1>JEDi Express</h1>

                <p>
                    Sistema Integrado de Gestión Logística
                </p>

            </div>


            <form id="formulario-login">

                <div class="campo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="correo@logistica.com"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingrese su contraseña"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-login"
                >
                    Iniciar sesión
                </button>


                <p
                    id="mensaje-login"
                    class="mensaje-login"
                ></p>

            </form>

        </div>

    </div>


    <script src="js/app.js"></script>

</body>

</html>
